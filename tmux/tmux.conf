set -g mouse on
setw -g mode-keys vi

# OSC52 でターミナルのクリップボードへ送る（SSH 越しでもローカルでも効く）
set -g set-clipboard on

# マウスドラッグ選択 → 離した瞬間にコピー（zellij と同じ挙動）
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# キーボード操作（v で選択開始、y でコピー）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# 全セッション横断のペイン検索・移動（prefix + C-p）
bind-key C-p display-popup -E -w 80% -h 80% "~/.local/bin/tmux-pane-fzf"

# ウィンドウ移動（prefix なし、Alt + h/l）
bind -n M-h previous-window
bind -n M-l next-window

# ペイン移動（prefix なし、Alt + j/k）
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# ベル通知（Claude Code の preferredNotifChannel=terminal_bell と対で使う）
# bell-action=other は「現在のウィンドウのベルは無視、他ウィンドウのみ通知」
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set -g window-status-bell-style 'fg=black,bg=yellow,bold'

# 待機中の Claude ペインへ一発ジャンプ（prefix + C-w）
# @cc は ~/.claude/hooks/tmux-cc-status.sh が書き込む
bind-key C-w run-shell "~/.local/bin/tmux-cc-jump"
