# ---------------------------------------------------------------------------
# 端末機能
# ---------------------------------------------------------------------------
# 24bit カラーを明示的に有効化する。これが無いと下の #rrggbb 指定が 256 色に
# 丸められてステータスラインの色が濁る（この環境の外側の client は
# xterm-256color で、自動検出では RGB が付かなかった）。
# 確認: tmux display -p '#{client_termfeatures}' に RGB が入っていること。
set  -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"

# ---------------------------------------------------------------------------
# 基本
# ---------------------------------------------------------------------------
set -g mouse on
setw -g mode-keys vi

# OSC52 でターミナルのクリップボードへ送る（SSH 越しでもローカルでも効く）
set -g set-clipboard on

# マウスドラッグ選択 → 離した瞬間にコピー（zellij と同じ挙動）
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# キーボード操作（v で選択開始、y でコピー）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# ---------------------------------------------------------------------------
# キーバインド
# ---------------------------------------------------------------------------
# 全セッション横断のペイン検索・移動（prefix + C-p）
bind-key C-p display-popup -E -w 80% -h 80% "~/.local/bin/tmux-pane-fzf"

# 待機中の Claude ペインへ一発ジャンプ（prefix + C-w）
# @cc は ~/.claude/hooks/tmux-cc-status.sh が書き込む
bind-key C-w run-shell "~/.local/bin/tmux-cc-jump"

# ウィンドウ移動（prefix なし、Alt + h/l）
bind -n M-h previous-window
bind -n M-l next-window

# ペイン移動（prefix なし、Alt + j/k）
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# ---------------------------------------------------------------------------
# ベル通知
# ---------------------------------------------------------------------------
# Claude Code の preferredNotifChannel=terminal_bell と対で使う。
# bell-action=other は「現在のウィンドウのベルは無視、他ウィンドウのみ通知」。
# 見た目（window-status-bell-style）はステータスライン節にまとめてある。
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ---------------------------------------------------------------------------
# ウィンドウ名
# ---------------------------------------------------------------------------
# 既定の automatic-rename-format は #{pane_current_command} なので、Claude Code
# を複数ウィンドウで走らせると全部 claude になって見分けが付かない。
# 作業ディレクトリの basename だけを出して「どのプロジェクトか」を見せる:
#   proj-x / _dotfiles / proj-y
#
# コマンド名（:#{pane_current_command}）は付けない。ほぼ全ウィンドウが claude
# なので 1 窓あたり 7 桁の重複になり、10 窓でウィンドウ一覧が端末幅を超える。
#
# 手動で rename-window した瞬間、そのウィンドウだけ自動リネームが止まる。
# 戻すときは prefix + , で名前を空にするか setw automatic-rename on。
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ---------------------------------------------------------------------------
# ステータスライン
# ---------------------------------------------------------------------------
# 方針は「情報を減らして、今アクティブなものだけを強く出す」。
# 配色は Catppuccin Mocha:
#   base #1e1e2e / surface1 #45475a / surface2 #585b70 / overlay0 #6c7086
#   text #cdd6f4 / mauve #cba6f7 / blue #89b4fa / yellow #f9e2af
#   peach #fab387 / red #f38ba8
#
# 全画面 TUI（Claude Code, vim）を使うと下端はプロンプトや入力欄と視覚的に
# 混ざるので、ステータスラインは上に逃がす。
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#1e1e2e,fg=#6c7086'

# 左: prefix 待ちの間だけ赤地の PREFIX に変わる。
# 「今 prefix 押したっけ?」が消えるのが一番効く。
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#f38ba8#,fg=#1e1e2e#,bold] PREFIX ,#[bg=#89b4fa#,fg=#1e1e2e#,bold] #S }#[default] '

# 右: 日付と時刻だけ。cpu/battery の類は情報を増やす方向なので入れない。
set -g status-right-length 40
set -g status-right '#[fg=#585b70]%m/%d %H:%M '

# ウィンドウ: 非アクティブは地味な灰色、アクティブだけ反転させる。
# 全部に色を付けると逆に読めない。
#
# ウィンドウ番号と名前の間の #{P:...} は「そのウィンドウの各ペインについて」
# 展開されるループで、
# Claude Code の状態（@cc、~/.claude/hooks/tmux-cc-status.sh が pane option
# として書き込む）を丸印にして出す:
#   approve = 許可待ちで止まっている → 赤 ●
#   idle    = 応答が終わって待っている → 黄 ●
#   busy    = 作業中 → 何も出さない
# ウィンドウオプションに焼き込むのではなくペインを毎回舐めるので、
# ペインが増減しても表示が古いまま残らない。
set -g window-status-format         ' #I #{P:#{?#{==:#{@cc},approve},#[fg=#f38ba8#,bold]●#[default] ,#{?#{==:#{@cc},idle},#[fg=#f9e2af#,bold]●#[default] ,}}}#W '
set -g window-status-current-format '#[bg=#cba6f7,fg=#1e1e2e,bold] #I #{P:#{?#{||:#{==:#{@cc},approve},#{==:#{@cc},idle}},● ,}}#W #[default]'
set -g window-status-separator ''
set -g window-status-style          'bg=#1e1e2e,fg=#6c7086'
set -g window-status-bell-style     'bg=#f9e2af,fg=#1e1e2e,bold'
set -g window-status-activity-style 'bg=#fab387,fg=#1e1e2e'

# display-message / コマンドプロンプトもステータスラインに出るので揃える
set -g message-style 'bg=#313244,fg=#cdd6f4'

# ---------------------------------------------------------------------------
# ペイン境界
# ---------------------------------------------------------------------------
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#cba6f7,bold'
set -g pane-border-style 'fg=#45475a'
set -g display-panes-time 3000
